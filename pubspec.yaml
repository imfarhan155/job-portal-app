name: job_portal_app
description: A Professional Job Portal App

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Backend
  supabase_flutter: ^2.9.1

  # Firebase
  firebase_core: ^4.12.1
  firebase_auth: ^6.0.2
  cloud_firestore: ^6.0.1
  firebase_storage: ^13.0.1

  # Resume / File Handling
  file_picker: ^10.3.2
  open_filex: ^4.7.0
  syncfusion_flutter_pdfviewer: ^30.2.7
  path: ^1.9.1
  dio: ^5.9.0
  path_provider: ^2.1.5
  share_plus: ^11.1.0

  # State Management
  provider: ^6.1.5

  # Image Picker
  image_picker: ^1.2.0

  # Cached Images
  cached_network_image: ^3.4.1

  # Fonts
  google_fonts: ^6.3.1

  # UUID
  uuid: ^4.5.1

  # Date Formatting
  intl: ^0.20.2

  # Loading
  flutter_spinkit: ^5.2.2
  firebase_messaging: ^16.0.1
  flutter_local_notifications: ^19.4.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true